name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: Abdev314
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Snake settings
          animation_mode: snake
          food_count: "5"

          # Use GitHub's dark-mode palette for empty cells
          palette: github-dark

          # Generated SVG
          output_path: dist/contribution-graph-snake.svg

      - name: Publish generated graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
