name: Generate Tetris Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tetris contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: Abdellahsyani
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Tetris settings
          animation_mode: tetromino
          tetromino_count: "5"
          animation_duration: "8"

          # Automatically adapt to GitHub light/dark mode
          palette: auto

          # Generated SVG
          output_path: dist/contribution-graph-tetris.svg

      - name: Publish generated graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
