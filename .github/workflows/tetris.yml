name: Generate Tetris Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tetris contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: Abdev314
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Tetris settings
          animation_mode: tetromino
          tetromino_count: "3"
          animation_duration: "8"

          # Use GitHub's light-mode green palette for real contribution cubes
          palette: github-dark

          # Generated SVG
          output_path: dist/contribution-graph-tetris.svg

      - name: Recolor moving tetromino cells to orange
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          svg_path = Path("dist/contribution-graph-tetris.svg")
          svg = svg_path.read_text()

          orange = "#e65100"

          def recolor_animate(match):
              rect_attrs = match.group(1)
              animate_tag = match.group(2)

              # Static fill of this contribution cell
              fill_m = re.search(r'fill="(#[0-9a-fA-F]{6})"', rect_attrs)
              if not fill_m:
                  return match.group(0)
              static_fill = fill_m.group(1).lower()

              # Colors used during the animation
              values_m = re.search(r'values="([^"]+)"', animate_tag)
              if not values_m:
                  return match.group(0)
              values = values_m.group(1)

              # The moving tetromino color is the one that differs from the static fill
              colors = re.findall(r'#[0-9a-fA-F]{6}', values)
              tetro_colors = {c.lower() for c in colors if c.lower() != static_fill}

              new_values = values
              for c in tetro_colors:
                  new_values = re.sub(re.escape(c), orange, new_values, flags=re.IGNORECASE)

              new_animate = animate_tag.replace(f'values="{values}"', f'values="{new_values}"')
              return f'<rect{rect_attrs}><animate{new_animate}/></rect>'

          # Match <rect> elements that contain an <animate> child
          svg = re.sub(
              r'<rect([^>]+)><animate([^/]+)/></rect>',
              recolor_animate,
              svg,
              flags=re.IGNORECASE,
          )

          svg_path.write_text(svg)
          PY

      - name: Publish generated graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
